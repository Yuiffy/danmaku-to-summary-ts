      - article [ref=e174]:
        - heading "Why prompt caching matters Copy link to why prompt caching matters" [level=2] [ref=e175]:
          - generic [ref=e176]: Why prompt caching matters
          - button "Copy link to why prompt caching matters" [ref=e177] [cursor=pointer]
        - paragraph [ref=e180]: "Prompt caching reuses work when requests share the same prompt prefix. This provides three main benefits:"
        - list [ref=e181]:
          - listitem [ref=e182]:
            - strong [ref=e183]: "Compute-efficient:"
            - text: Avoid recalculating a prompt prefix that the model has already processed.
          - listitem [ref=e184]:
            - strong [ref=e185]: "Cheaper input tokens:"
            - text: Pay the model’s reduced cached-input rate for reused tokens, discounted up to 90%.
          - listitem [ref=e186]:
            - strong [ref=e187]: "Faster:"
            - text: Reduce the time spent processing input before the response starts.
        - paragraph [ref=e188]:
          - text: Prompt caching is enabled by default for supported OpenAI models. Use the
          - link "Prompt Caching Dashboard" [ref=e189] [cursor=pointer]:
            - /url: https://platform.openai.com/usage?usage_section=prompt-caching
          - text: to monitor cache read hit rates.
        - heading "What is the prompt cache? Copy link to what is the prompt cache" [level=2] [ref=e190]:
          - generic [ref=e191]: What is the prompt cache?
          - button "Copy link to what is the prompt cache" [ref=e192] [cursor=pointer]
        - paragraph [ref=e195]: As the model processes input tokens, it calculates intermediate key-value (KV) states. These states let the model refer back to earlier tokens while processing new input and generating a response.
        - paragraph [ref=e196]: Prompt caching preserves that state for a reusable prefix. When a later request has the same prefix and finds a matching cache entry, the model can reuse the saved state instead of processing those tokens again. It still needs to process any new input to generate a new response.
        - paragraph [ref=e206]: The prompt cache stores key-value (KV) tensors, not the tokens themselves.
        - link [ref=e208] [cursor=pointer]:
          - /url: codex://threads/new?prompt=Explain+how+prompt+caching+works+inside+a+language+model.+Use+the+illustrative+token+sequence+tiny%2C+chips%2C+power%2C+big%2C+ideas+to+explain+attention%2C+key-value+%28KV%29+states%2C+and+how+saved+prefix+state+avoids+repeated+computation.+Distinguish+token-by-token+generation+from+prompt-cache+reuse+across+API+requests.+Keep+the+explanation+approachable+and+note+that+the+token+boundaries+are+illustrative.%0A%0AUse+%5B%40OpenAI+Developers%5D%28plugin%3A%2F%2Fopenai-developers%40openai-curated%29+and+https%3A%2F%2Fdevelopers.openai.com%2Fapi%2Fdocs%2Fguides%2Fprompt-caching.
          - paragraph [ref=e211]: Ask ChatGPT for a deeper explanation
