        - paragraph [ref=e496]: Cached states live on individual machines, where traffic above 15 requests per minute can lead to overflow routing. A request can reuse a cached prefix only if it reaches a machine holding a matching entry that has not expired. Routing requests to the right machine is therefore important for cache reuse.
        - paragraph [ref=e506]:
          - text: Caches are not shared across organizations and cannot be reused across
          - link "regional processing boundaries" [ref=e507] [cursor=pointer]:
