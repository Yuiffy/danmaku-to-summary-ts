        - heading "How caching works Copy link to how caching works" [level=2] [ref=e321]:
          - generic [ref=e322]: How caching works
          - button "Copy link to how caching works" [ref=e323] [cursor=pointer]
        - paragraph [ref=e326]:
          - text: A
          - strong [ref=e327]: cache breakpoint
          - text: marks the end of a prompt prefix that OpenAI can save to the cache and reuse in later requests. The first request writes an eligible prefix to the cache and a later request looks for the longest matching cached prefix available, working backward through eligible breakpoints until it finds a match.
        - paragraph [ref=e328]:
          - text: A prompt prefix must meet the model’s
          - strong [ref=e329]: minimum cacheable token length
          - text: before it can be cached. Tokens in the OpenAI-provided hidden system content do not count toward this minimum. The minimum cacheable prompt length is 1,024 tokens for GPT-5.6 and later and 2,048 tokens for models older than GPT-5.6. You may occasionally get cache hits below 2,048 tokens for some earlier models. See the
          - link "model comparison" [ref=e330] [cursor=pointer]:
            - /url: "#summary-of-model-differences"
          - text: for other differences.
        - paragraph [ref=e331]: After the minimum cacheable token length, you can choose where to place cache breakpoints explicitly, or let OpenAI choose their locations implicitly. The available options depend on the model.
        - button "GPT-5.6 and later" [ref=e334] [cursor=pointer]
        - button "Earlier models" [ref=e341] [cursor=pointer]
