          - text: .
        - paragraph [ref=e508]: "OpenAI handles routing automatically. Within an organization and processing region, routing for a given model depends on:"
        - list [ref=e509]:
          - listitem [ref=e510]: Current machine load and available capacity.
          - listitem [ref=e511]: A hash of the initial tokens after the hidden OpenAI content, including tool definitions when present. The number of tokens hashed varies by model.
