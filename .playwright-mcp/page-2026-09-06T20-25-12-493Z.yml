          - paragraph [ref=e160]: Ensure text responses from the model adhere to a JSON schema you define.
          - button "Copy Page" [ref=e164] [cursor=pointer]
      - article [ref=e169]:
        - paragraph [ref=e170]: JSON is one of the most widely used formats in the world for applications to exchange data.
        - paragraph [ref=e171]:
          - text: Structured Outputs is a feature that ensures the model will always generate responses that adhere to your supplied
          - link "JSON Schema" [ref=e172] [cursor=pointer]:
            - /url: https://json-schema.org/overview/what-is-jsonschema
          - text: ", so you don’t need to worry about the model omitting a required key, or hallucinating an invalid enum value."
        - paragraph [ref=e173]: "Some benefits of Structured Outputs include:"
        - list [ref=e174]:
          - listitem [ref=e175]:
            - strong [ref=e176]: "Reliable type-safety:"
            - text: No need to validate or retry incorrectly formatted responses
          - listitem [ref=e177]:
            - strong [ref=e178]: "Explicit refusals:"
            - text: Safety-based model refusals are now programmatically detectable
          - listitem [ref=e179]:
            - strong [ref=e180]: "Simpler prompting:"
            - text: No need for strongly worded prompts to achieve consistent formatting
        - paragraph [ref=e181]:
          - text: In addition to supporting JSON Schema in the REST API, the OpenAI SDKs for
          - link "Python" [ref=e182] [cursor=pointer]:
            - /url: https://github.com/openai/openai-python/blob/main/helpers.md#structured-outputs-parsing-helpers
          - text: and
          - link "JavaScript" [ref=e183] [cursor=pointer]:
            - /url: https://github.com/openai/openai-node/blob/master/helpers.md#structured-outputs-parsing-helpers
          - text: also make it easy to define object schemas using
          - link "Pydantic" [ref=e184] [cursor=pointer]:
            - /url: https://docs.pydantic.dev/latest/
          - text: and
          - link "Zod" [ref=e185] [cursor=pointer]:
            - /url: https://zod.dev/
          - text: respectively. Below, you can see how to extract information from unstructured text that conforms to a schema defined in code.
        - generic [ref=e188]:
          - generic [ref=e189]:
            - generic [ref=e190]: Getting a structured response
