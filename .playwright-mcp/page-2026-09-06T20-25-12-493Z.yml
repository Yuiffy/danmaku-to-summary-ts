        - heading "JSON mode Copy link to json mode" [level=2] [ref=e1647]:
          - generic [ref=e1648]: JSON mode
          - button "Copy link to json mode" [ref=e1649] [cursor=pointer]
        - paragraph [ref=e1661]: JSON mode is a more basic version of the Structured Outputs feature. While JSON mode ensures that model output is valid JSON, Structured Outputs reliably matches the model’s output to the schema you specify. We recommend you use Structured Outputs if it is supported for your use case.
        - paragraph [ref=e1662]: When JSON mode is turned on, the model’s output is ensured to be valid JSON, except for in some edge cases that you should detect and handle appropriately.
        - paragraph [ref=e1664]:
          - text: To turn on JSON mode with the Responses API you can set the
          - code [ref=e1665]: text.format
          - text: to
          - code [ref=e1666]: "{ \"type\": \"json_object\" }"
          - text: . If you are using function calling, JSON mode is always turned on.
        - paragraph [ref=e1667]: "Important notes:"
        - list [ref=e1668]:
          - listitem [ref=e1669]: When using JSON mode, you must always instruct the model to produce JSON via some message in the conversation, for example via your system message. If you don’t include an explicit instruction to generate JSON, the model may generate an unending stream of whitespace and the request may run continually until it reaches the token limit. To help ensure you don’t forget, the API will throw an error if the string “JSON” does not appear somewhere in the context.
          - listitem [ref=e1670]: JSON mode will not guarantee the output matches any specific schema, only that it is valid and parses without errors. You should use Structured Outputs to ensure it matches your schema, or if that is not possible, you should use a validation library and potentially retries to ensure that the output matches your desired schema.
          - listitem [ref=e1671]: Your application must detect and handle the edge cases that can result in the model output not being a complete JSON object (see below)
        - button "Handling edge cases" [ref=e1674] [cursor=pointer]
