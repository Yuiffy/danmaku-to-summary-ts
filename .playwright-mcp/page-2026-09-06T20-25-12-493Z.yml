        - heading [level=2] [ref=e265] [cursor=pointer]:
          - paragraph [ref=e266]: When to use Structured Outputs via function calling vs via text.format
        - paragraph [ref=e268]: "Structured Outputs is available in two forms in the OpenAI API:"
        - list [ref=e269]:
          - listitem [ref=e270]:
            - text: When using
            - link "function calling" [ref=e271] [cursor=pointer]:
              - /url: /api/docs/guides/function-calling
          - listitem [ref=e272]:
            - text: When using a
            - code [ref=e273]: json_schema
            - text: response format
        - paragraph [ref=e274]: Function calling is useful when you are building an application that bridges the models and functionality of your application.
        - paragraph [ref=e275]: For example, you can give the model access to functions that query a database in order to build an AI assistant that can help users with their orders, or functions that can interact with the UI.
        - paragraph [ref=e276]:
          - text: Conversely, Structured Outputs via
          - code [ref=e277]: response_format
          - text: are more suitable when you want to indicate a structured schema for use when the model responds to the user, rather than when the model calls a tool.
        - paragraph [ref=e278]: For example, if you are building a math tutoring application, you might want the assistant to respond to your user using a specific JSON Schema so that you can generate a UI that displays different parts of the model’s output in distinct ways.
        - paragraph [ref=e279]: "Put simply:"
        - list [ref=e281]:
          - listitem [ref=e282]:
            - text: If you are connecting the model to tools, functions, data, etc. in your system, then you should use function calling - If you want to structure the model’s output when it responds to the user, then you should use a structured
            - code [ref=e283]: text.format
        - generic [ref=e293]:
          - paragraph [ref=e294]: The remainder of this guide will focus on non-function calling use cases in the Responses API. To learn more about how to use Structured Outputs with function calling, check out the
          - link [ref=e295] [cursor=pointer]:
            - /url: /api/docs/guides/function-calling#strict-mode
            - paragraph [ref=e296]: Function Calling
          - paragraph [ref=e297]: guide.
        - heading "Structured Outputs vs JSON mode Copy link to structured outputs vs json mode" [level=3] [ref=e298]:
          - generic [ref=e299]: Structured Outputs vs JSON mode
          - button "Copy link to structured outputs vs json mode" [ref=e300] [cursor=pointer]
        - paragraph [ref=e303]:
          - text: Structured Outputs is the evolution of
          - link "JSON mode" [ref=e304] [cursor=pointer]:
            - /url: "#json-mode"
          - text: . While both ensure valid JSON is produced, only Structured Outputs ensure schema adherence. Both Structured Outputs and JSON mode are supported in the Responses API, Chat Completions API, Assistants API, Fine-tuning API and Batch API.
        - paragraph [ref=e305]: We recommend always using Structured Outputs instead of JSON mode when possible.
