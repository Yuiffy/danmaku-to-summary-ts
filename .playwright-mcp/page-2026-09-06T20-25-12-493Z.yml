        - heading "Handling user-generated input Copy link to handling user generated input" [level=4] [ref=e673]:
          - generic [ref=e674]: Handling user-generated input
          - button "Copy link to handling user generated input" [ref=e675] [cursor=pointer]
        - paragraph [ref=e678]: If your application is using user-generated input, make sure your prompt includes instructions on how to handle situations where the input cannot result in a valid response.
        - paragraph [ref=e679]: The model will always try to adhere to the provided schema, which can result in hallucinations if the input is completely unrelated to the schema.
        - paragraph [ref=e680]: You could include language in your prompt to specify that you want to return empty parameters, or a specific sentence, if the model detects that the input is incompatible with the task.
        - heading "Handling mistakes Copy link to handling mistakes" [level=4] [ref=e681]:
          - generic [ref=e682]: Handling mistakes
          - button "Copy link to handling mistakes" [ref=e683] [cursor=pointer]
        - paragraph [ref=e686]:
          - text: Structured Outputs can still contain mistakes. If you see mistakes, try adjusting your instructions, providing examples in the system instructions, or splitting tasks into simpler subtasks. Refer to the
          - link "prompt engineering guide" [ref=e687] [cursor=pointer]:
            - /url: /api/docs/guides/prompt-engineering
          - text: for more guidance on how to tweak your inputs.
        - heading "Avoid JSON schema divergence Copy link to avoid json schema divergence" [level=4] [ref=e688]:
          - generic [ref=e689]: Avoid JSON schema divergence
          - button "Copy link to avoid json schema divergence" [ref=e690] [cursor=pointer]
        - paragraph [ref=e693]: To prevent your JSON Schema and corresponding types in your programming language from diverging, we strongly recommend using the native Pydantic/zod sdk support.
        - paragraph [ref=e694]: If you prefer to specify the JSON schema directly, you could add CI rules that flag when either the JSON schema or underlying data objects are edited, or add a CI step that auto-generates the JSON Schema from type definitions (or vice-versa).
        - heading "Streaming Copy link to streaming" [level=2] [ref=e695]:
          - generic [ref=e696]: Streaming
          - button "Copy link to streaming" [ref=e697] [cursor=pointer]
        - paragraph [ref=e700]: You can use streaming to process model responses or function call arguments as they are being generated, and parse them as structured data.
        - paragraph [ref=e701]: That way, you don’t have to wait for the entire response to complete before handling it. This is particularly useful if you would like to display JSON fields one by one, or handle function call arguments as soon as they are available.
        - paragraph [ref=e702]: We recommend relying on the SDKs to handle streaming with Structured Outputs.
