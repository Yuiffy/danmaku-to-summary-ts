        - heading "Objects have limitations on nesting depth and size" [level=4] [ref=e1120]
        - paragraph [ref=e1121]: A schema may have up to 5000 object properties total, with up to 10 levels of nesting.
        - heading "Limitations on total string size" [level=4] [ref=e1122]
        - paragraph [ref=e1123]: In a schema, total string length of all property names, definition names, enum values, and const values cannot exceed 120,000 characters.
        - heading "Limitations on enum size" [level=4] [ref=e1124]
        - paragraph [ref=e1125]: A schema may have up to 1000 enum values across all enum properties.
        - paragraph [ref=e1126]: For a single enum property with string values, the total string length of all enum values cannot exceed 15,000 characters when there are more than 250 enum values.
